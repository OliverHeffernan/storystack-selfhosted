pid /home/ollieh/Documents/storystack-staging/preview/nginx.pid;
error_log /home/ollieh/Documents/storystack-staging/preview/error.log warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    server {
        listen 127.0.0.1:8154;
        server_name localhost;
        root /home/ollieh/Documents/storystack-staging/app/dist;
        client_max_body_size 6m;

        location /api/ {
            proxy_pass http://127.0.0.1:3054;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
