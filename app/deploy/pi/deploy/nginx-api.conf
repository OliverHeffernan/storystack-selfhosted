# Add inside the existing StoryStack server block only, after cutover approval.
# Do not create a separate hostname or change the Cloudflare Tunnel.
location = /api {
    return 308 /api/;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3054;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, rather than append to, untrusted incoming forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
    proxy_read_timeout 60s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
