pid /home/ollieh/.config/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {

    types {
        text/html html htm shtml;
        application/javascript js;
        text/css css;
    }
    access_log /home/ollieh/.config/nginx/logs/access.log;
    error_log /home/ollieh/.config/nginx/logs/error.log;

	server {
		listen 8147;
		server_name stratvis.olihef.com localhost;
		root /home/ollieh/Documents/stratvis/frontend/dist;

		location / {
			try_files $uri $uri/ /index.html;
		}

		location \.js$ {
			add_header Content-Type application/javascript;
		}
	}

    server {
        listen 8146;
        server_name paperweight.olihef.com localhost;
        root /home/ollieh/Documents/paperWeight/dist;

        location / {
            #index index.html
            try_files $uri $uri/ /index.html;
        }

        location ~*.(js)$ {
            add_header Content-Type application/javascript;
        }
    }


    server {
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        listen 8145;
        server_name paperweight-support.olihef.com localhost;
        index index.html;

        location / {
            # content location
            root /home/ollieh/Documents/paperWeight/support/.vitepress/dist;

            # exact matches -> reverse clean urls -> folders -> not found
            try_files $uri $uri.html $uri/ =404;

            # non existent pages
            error_page 404 /404.html;

            # a folder without index.html raises 403 in this setup
            error_page 403 /404.html;

            # adjust caching headers
            # files in the assets folder have hashes filenames
            location ~* ^/assets/ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    server {
        listen 8143;
        server_name olihef.com localhost;
        root /home/ollieh/Documents/oliverheffernan.github.io/dist;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 8144;
        server_name storystack.olihef.com localhost;
        root /home/ollieh/Documents/storystack-selfhosted/app/dist;

        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        location /api/ {
            client_max_body_size 6m;
            proxy_pass http://127.0.0.1:3055;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
